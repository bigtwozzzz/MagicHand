#Exp params
epochs: 10
log_every: 200 # Log every n iterations (reduced frequency for speed)
eval_every: 1 # Eval and save every n epochs (reduced frequency for speed)
test_every: 0 # Test every n epochs
experiment_name: SSDLiteMobileNetV3Large
work_dir: work_dir

# Stop training conditions
early_stopping:
    epochs: 10
    metric: 0.01


# Dataset configuration
dataset:
    annotations_train: annotations/train
    annotations_val: annotations/val
    annotations_test: annotations/test

    dataset_train: dataset/HaGRIDv2_dataset_512
    dataset_val: dataset/HaGRIDv2_dataset_512
    dataset_test: dataset/HaGRIDv2_dataset_512

    img_size: &img_size 224 # Image size for training, must be square
    img_mean: &img_mean [0.54, 0.499, 0.474]
    img_std: &img_std [0.234, 0.235, 0.231]
    subset: -1 # Amount of training data

    one_class: False

    targets:
        - grabbing
        - grip
        - holy
        - point
        - call
        - three3
        - timeout
        - xsign
        - hand_heart
        - hand_heart2
        - little_finger
        - middle_finger
        - take_picture
        - dislike
        - fist
        - four
        - like
        - mute
        - ok
        - one
        - palm
        - peace
        - peace_inverted
        - rock
        - stop
        - stop_inverted
        - three
        - three2
        - two_up
        - two_up_inverted
        - three_gun
        - thumb_index
        - thumb_index2
        - no_gesture

# Transform and augmentation pipeline. See https://albumentations.ai/docs/ for using
train_transforms:
    LongestMaxSize:
        max_size: *img_size
        p: 1
    PadIfNeeded:
        min_height: *img_size
        min_width: *img_size
        value: [144,144,144]
        border_mode: 0
        p: 1

val_transforms:
    LongestMaxSize:
        max_size: *img_size
        p: 1
    PadIfNeeded:
        min_height: *img_size
        min_width: *img_size
        value: [144,144,144]
        border_mode: 0
        p: 1

test_transforms:
    LongestMaxSize:
        max_size: *img_size
        p: 1
    PadIfNeeded:
        min_height: *img_size
        min_width: *img_size
        value: [144,144,144]
        border_mode: 0
        p: 1

# Model parameters. See model_card for using
model:
    name: SSDLiteMobileNetV3Large
    pretrained: False
    pretrained_backbone: False
    checkpoint: null

# Model optimizer params
optimizer:
    name: SGD
    params:
        lr: 0.0001
        momentum: 0.9
        # weight_decay: 0.0005
        nesterov: True

scheduler:
    name: null

train_params:
    num_workers: 4
    shuffle: True
    batch_size: 32
    prefetch_factor: 2

test_params:
    num_workers: 4
    shuffle: False
    batch_size: 32
    prefetch_factor: 2

val_params:
    num_workers: 4
    shuffle: False
    batch_size: 32
    prefetch_factor: 2
